<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신혼여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>우리의 신혼여행 · 시드니 & 뉴질랜드 남섬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --ink:#0F2A33; --muted:#4B6168; --faint:#7A8E93; --line:#E3EAEB;
  --lake:#0E7C7B; --lake-ink:#0E6E6D; --lake-soft:#E1F0EF; --on-accent:#FFFFFF;
  --gold:#8A5A12; --gold-soft:#FFF4E5; --lupin:#6B4F98; --lupin-soft:#ECE6F5;
  --warn:#9A4F0A; --warn-soft:#FFF4E5; --warn-ink:#6B3A08;
  --hero:#0F2A33; --hero-ink:#FFFFFF; --hero-muted:#B8CDD1; --hero-chip:rgba(255,255,255,.12); --hero-accent:#9FC9C7;
  --cur:#B5651D; --nav-bg:rgba(255,255,255,.94); --shadow:0 8px 24px rgba(15,42,51,.12); --card-shadow:0 1px 2px rgba(15,42,51,.06);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --head:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --stars:none;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0B1424; --surface:#131F33; --ink:#E8EEF6; --muted:#9DB0C8; --faint:#6F829C; --line:#22344F;
  --lake:#E8C27A; --lake-ink:#E8C27A; --lake-soft:rgba(232,194,122,.14); --on-accent:#1A1408;
  --gold:#E8C27A; --gold-soft:#2E2614; --lupin:#B49AE0; --lupin-soft:#2C2540;
  --warn:#F3B27A; --warn-soft:#2E2212; --warn-ink:#F3D9A4;
  --hero:#131F33; --hero-ink:#E8EEF6; --hero-muted:#9DB0C8; --hero-chip:rgba(232,194,122,.14); --hero-accent:#E8C27A;
  --cur:#E8C27A; --nav-bg:rgba(14,26,46,.96); --shadow:0 8px 24px rgba(0,0,0,.45); --card-shadow:none;
  --head:"Noto Serif KR","AppleMyungjo",serif;
  --stars:block;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--lake-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 120px}

header.top{padding:18px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-family:var(--head);font-size:19px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.status{font-size:13px;color:var(--lake-ink);font-weight:600}
.syncnote{font-size:12px;color:var(--faint);margin-top:2px}
.themebtn{flex:0 0 auto;height:40px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.themebtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

/* hero (today) */
.hero{position:relative;overflow:hidden;margin-top:12px;background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:22px 20px 18px;border:1px solid transparent}
:root[data-theme="dark"] .hero{border-color:var(--line)}
.hero .stars{display:var(--stars);position:absolute;inset:0;pointer-events:none}
.hero .eyebrow{position:relative;font-size:13px;color:var(--hero-accent);font-weight:600}
.hero h1{position:relative;font-family:var(--head);margin:4px 0 0;font-size:26px;line-height:1.3;font-weight:700;letter-spacing:-.02em}
.hero .wxrow{position:relative;display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px;gap:12px}
.hero .temp{font-size:36px;font-weight:700;line-height:1}
.hero .wxmeta{font-size:12px;color:var(--hero-muted)}
.hero .chips{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.hero .chips span{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--hero-chip)}
.hero .src{position:relative;font-size:11px;color:var(--hero-muted);margin-top:10px}
.prog{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:var(--hero-accent)}

.nextcard{margin-top:12px;background:var(--surface);border-radius:20px;padding:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--card-shadow);border:1px solid transparent}
:root[data-theme="dark"] .nextcard{background:var(--lake);color:var(--on-accent)}
.nextcard .ic{width:44px;height:44px;border-radius:14px;background:var(--lake-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
:root[data-theme="dark"] .nextcard .ic{background:rgba(26,20,8,.12)}
.nextcard .ic svg{width:22px;height:22px;stroke:var(--lake-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .nextcard .ic svg{stroke:var(--on-accent)}
.nextcard .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.nextcard .k{font-size:12px;color:var(--muted);font-weight:600}
:root[data-theme="dark"] .nextcard .k{color:rgba(26,20,8,.7)}
.nextcard .v{font-size:16px;font-weight:600;line-height:1.35}
.nextcard .go{flex:0 0 auto;height:44px;padding:0 14px;border-radius:12px;background:var(--lake);color:var(--on-accent);font-size:14px;font-weight:600;text-decoration:none;display:flex;align-items:center;border:0;cursor:pointer}
:root[data-theme="dark"] .nextcard .go{background:var(--on-accent);color:var(--lake)}

.flow{list-style:none;margin:0;padding:0}
.flow li{display:flex;gap:12px;align-items:flex-start}
.flow .tm{width:52px;flex:0 0 auto;font-size:13px;font-weight:600;color:var(--muted);padding-top:1px;font-variant-numeric:tabular-nums}
.flow .rail{width:12px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.flow .dot{width:10px;height:10px;border-radius:5px;border:2px solid var(--faint);margin-top:6px}
.flow .bar{width:2px;flex:1;min-height:22px;background:var(--line)}
.flow .txt{padding-bottom:12px;font-size:14px}
.flow li.past .txt{color:var(--faint);text-decoration:line-through}
.flow li.past .dot{background:var(--faint);border-color:var(--faint)}
.flow li.cur .tm{color:var(--lake-ink)}
.flow li.cur .dot{background:var(--lake);border-color:var(--lake);box-shadow:0 0 0 4px var(--lake-soft)}
.flow li.cur .txt{font-weight:600}

/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:14px 18px 10px;margin:0 -18px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:9px 10px 8px;min-width:64px;text-align:center;cursor:pointer;position:relative}
.chip .d{font-size:20px;line-height:1;font-weight:700}
.chip .w{font-size:11px;color:var(--muted)}
.chip .p{font-size:11px;margin-top:3px;white-space:nowrap;max-width:68px;overflow:hidden;text-overflow:ellipsis}
.chip.au::after,.chip.nz::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:5px;width:14px;height:3px;border-radius:2px;background:var(--lake)}
.chip.au::after{background:var(--lupin)}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sel .w{color:inherit;opacity:.75}
.chip .today{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--cur);color:#fff;border-radius:8px;padding:0 6px;line-height:16px}
:root[data-theme="dark"] .chip .today{color:#1A1408}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--lake)}
.legend span.au::before{background:var(--lupin)}

/* day view */
.dayhead{margin:10px 0 4px}
.dayhead .num{font-size:13px;color:var(--muted)}
.dayhead h2{font-family:var(--head);font-size:26px;margin:2px 0 0;line-height:1.3;letter-spacing:-.02em}
section.block{margin-top:22px}
section.block h3{font-size:15px;margin:0 0 10px;font-weight:700}
.stay{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--card-shadow)}
:root[data-theme="dark"] .stay,:root[data-theme="dark"] .leg,:root[data-theme="dark"] .list,:root[data-theme="dark"] table.info{border:1px solid var(--line)}
.stay .kind{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-block}
.kind.hotel{background:var(--lupin-soft);color:var(--lupin)}
.kind.park{background:var(--lake-soft);color:var(--lake-ink)}
.kind.wild{background:var(--gold-soft);color:var(--gold)}
.stay .name{font-size:18px;font-weight:700;margin:8px 0 2px;line-height:1.35}
.stay .meta{font-size:13px;color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);background:var(--bg);cursor:pointer}
.btn.primary{background:var(--lake);border-color:var(--lake);color:var(--on-accent);font-weight:600}

.timeline{list-style:none;margin:0;padding:0 0 0 2px}
.timeline li{position:relative;padding:0 0 12px 22px;font-size:14px}
.timeline li::before{content:"";position:absolute;left:0;top:7px;width:10px;height:10px;border-radius:50%;border:2px solid var(--faint)}
.timeline li::after{content:"";position:absolute;left:5px;top:21px;bottom:2px;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .t{font-weight:600;font-size:13px;margin-right:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.leg{background:var(--surface);border-radius:18px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--card-shadow)}
.leg .ft{font-weight:600}
.leg .km{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--card-shadow)}
.list li{padding:13px 14px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.list li:first-child{border-top:0}
.list .body{flex:1;min-width:0}
.list .nm{font-weight:600}
.list .ds{font-size:13px;color:var(--muted)}
.list .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mini{font-size:12px;min-height:32px;display:inline-flex;align-items:center;padding:0 10px;border-radius:10px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--bg);white-space:nowrap;cursor:pointer}
.mini.on{background:var(--lake);border-color:var(--lake);color:var(--on-accent)}
.tips{list-style:none;padding:0;margin:0}
.tips li{padding:11px 14px;border-radius:14px;background:var(--lake-soft);margin-bottom:8px;font-size:14px}
.tips li.warn{background:var(--warn-soft);color:var(--warn-ink)}
.tips li.warn b{color:var(--warn)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:12px;font:inherit;resize:vertical}
.saved{font-size:12px;color:var(--muted);min-height:16px;margin-top:4px}

/* route */
.mapcard{background:var(--surface);border-radius:22px;padding:10px 8px 4px;overflow:hidden;box-shadow:var(--card-shadow)}
:root[data-theme="dark"] .mapcard{border:1px solid var(--line)}
.mapcard svg{display:block;width:100%;height:auto}
.mapcard .road{fill:none;stroke:var(--lake);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mapcard .opt{fill:none;stroke:var(--faint);stroke-width:2;stroke-dasharray:4 5}
.mapcard .stop circle{fill:var(--surface);stroke:var(--lake);stroke-width:2.5;cursor:pointer}
.mapcard .stop.wild circle{stroke:var(--gold)}
.mapcard .stop.cur circle{fill:var(--cur);stroke:var(--cur)}
.mapcard text{font-family:var(--sans);font-size:12.5px;fill:var(--ink)}
.mapcard text.n{font-size:11px;fill:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stats div{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--card-shadow)}
:root[data-theme="dark"] .stats div{border:1px solid var(--line)}
.stats b{display:block;font-family:var(--head);font-size:20px;line-height:1.2}
.stats span{font-size:12px;color:var(--muted)}

/* prep */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--line);margin-top:14px}
.seg button{min-height:40px;border:0;border-radius:11px;background:transparent;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--card-shadow)}
.prephead{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.prephead b{font-family:var(--head);font-size:30px;line-height:1}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:var(--lake)}
.check li{align-items:center;cursor:pointer;min-height:52px}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--faint);flex:0 0 auto;display:grid;place-items:center}
.done .box{background:var(--lake);border-color:var(--lake)}
.done .box::after{content:"";width:10px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .nm{text-decoration:line-through;color:var(--faint)}
.src{font-size:11px;color:var(--muted)}

table.info{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--card-shadow)}
table.info td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
table.info tr:first-child td{border-top:0}
table.info td:first-child{color:var(--muted);width:38%}
p.prose{margin:0 0 10px}

nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:536px;margin:0 auto}
nav.tabs .in{display:flex;justify-content:space-around;align-items:center;height:64px;background:var(--nav-bg);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
nav.tabs button{width:58px;height:50px;background:none;border:0;border-radius:14px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--lake-ink);font-weight:600;background:var(--lake-soft)}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="title">우리 둘의 남반구 15일</h1>
      <div class="sub" id="status"></div>
    </div>
    <button class="themebtn" id="themebtn" data-themecycle="1" aria-label="화면 테마 바꾸기"></button>
  </header>
  <div class="syncnote hidden" id="syncnote"></div>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="메뉴"><div class="in" role="tablist">
  <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>오늘</button>
  <button role="tab" data-tab="day" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정</button>
  <button role="tab" data-tab="route" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 19c3-1 3-6 7-7s5-6 7-8"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="4" r="2"/></svg>경로</button>
  <button role="tab" data-tab="check" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7l2 2 4-4M4 16l2 2 4-4M13 7h7M13 16h7"/></svg>준비</button>
  <button role="tab" data-tab="info" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>정보</button>
</div></nav>

<script>
const G = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const DIR = (o,d,w) => "https://www.google.com/maps/dir/?api=1" + (o ? "&origin=" + encodeURIComponent(o) : "") + "&destination=" + encodeURIComponent(d) + (w ? "&waypoints=" + encodeURIComponent(w) : "") + "&travelmode=driving";
const TRANSIT = (o,d) => "https://www.google.com/maps/dir/?api=1" + (o ? "&origin=" + encodeURIComponent(o) : "") + "&destination=" + encodeURIComponent(d) + "&travelmode=transit";
const UBER = d => "https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff%5Bformatted_address%5D=" + encodeURIComponent(d);
const VIEW_SYD = "View Sydney, 17 Blue Street, North Sydney NSW";
const MANTRA = "Mantra on Kent, 433 Kent Street, Sydney NSW";
const SYD_T1 = "Sydney International Airport T1";
const NEO_PARK = "햇내로28번길 10, 운서동, 인천";
const MAUI_ZQN = "9 Purple Ash Avenue, Frankton, Queenstown 9300";
const MAUI_CHC = "159 Orchard Road, Harewood, Christchurch 8051";

const DAYS = [
 {date:"2026-12-13", c:"au", place:"시드니", title:"출국, 시드니 도착",
  stay:{kind:"hotel", name:"뷰 시드니", meta:"12/13–15 · 2박 · 노스시드니 17 Blue St (예약 주소와 같은지 확인)", q:VIEW_SYD},
  times:[["04:30","집에서 자차로 출발"],["05:20","네오파킹 더예스클라우드 주차 (지하 4~5층)"],["05:30","카카오T 택시로 인천공항 2터미널"],["05:50","2터미널 도착, 체크인"],["08:00","이륙"],["20:05","시드니 도착 (호주 시각)"]],

/* ---------- state (browser + shared db) ---------- */
let state = {checks:{}, visited:{}, notes:{}};
try { const s = localStorage.getItem("honeymoon-state"); if (s) state = Object.assign(state, JSON.parse(s)); } catch(e){}
let dbRef = null, writing = false, pending = false, saveTimer = null;
function persist(){
  try { localStorage.setItem("honeymoon-state", JSON.stringify(state)); } catch(e){}
  if (!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!dbRef) return;
  if (writing){ pending = true; return; }
  writing = true;
  try { await dbRef.set(JSON.parse(JSON.stringify(state))); setSync("두 기기에서 같은 내용이 보이도록 저장됩니다."); }
  catch(e){ setSync("이 기기에만 저장 중입니다. 연결되면 다시 동기화됩니다."); }
  writing = false;
  if (pending){ pending = false; flush(); }
}
function setSync(t){ document.getElementById("syncnote").textContent = t; }
(async () => {
  try {
    if (!window.claude || !window.claude.use) { setSync("체크와 메모는 이 기기에 저장됩니다."); return; }
    const db = await window.claude.use("db");
    if (!db) { setSync("체크와 메모는 이 기기에 저장됩니다."); return; }
    dbRef = db.doc("trip/state");
    const timer = setTimeout(() => setSync("저장소에 아직 연결되지 않았어요. 이 기기 내용으로 보여드려요."), 10000);
    dbRef.onSnapshot(snap => {
      if (!snap.fromCache) clearTimeout(timer);
      if (snap.exists && !snap.hasPendingWrites){
        const d = snap.data() || {};
        state = {checks:d.checks||{}, visited:d.visited||{}, notes:d.notes||{}};
        try { localStorage.setItem("honeymoon-state", JSON.stringify(state)); } catch(e){}
        if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") render();
      } else if (!snap.exists && !snap.fromCache){
        flush();
      }
      if (!snap.fromCache) setSync("체크와 메모가 저장되어 다른 기기에서도 보여요.");
    }, () => { clearTimeout(timer); setSync("체크와 메모는 이 기기에 저장됩니다."); dbRef = null; });
  } catch(e){ setSync("체크와 메모는 이 기기에 저장됩니다."); }
})();

function outfit(mx, mn, rain, wind, uv){
  const o=[];
  if (mx>=27) o.push("반팔·반바지, 통풍 잘 되는 옷");
  else if (mx>=22) o.push("반팔에 얇은 긴팔 하나");
  else if (mx>=17) o.push("긴팔 티셔츠나 얇은 니트");
  else o.push("긴팔에 플리스나 경량 패딩");
  if (mn<=5) o.push("아침저녁은 겨울처럼 추워요. 패딩, 비니, 장갑");
  else if (mn<=10) o.push("아침저녁은 쌀쌀해요. 플리스나 경량 패딩");
  else if (mn<=15) o.push("저녁엔 얇은 겉옷(가디건, 바람막이)");
  if (rain!=null && rain>=50) o.push("비 확률이 높아요. 방수 재킷이나 우산");
  else if (rain!=null && rain>=30) o.push("비가 올 수 있어요. 방수 재킷 챙기기");
  if (wind!=null && wind>=30) o.push("바람이 강해요. 바람막이 필수");
  if (uv==null || uv>=8) o.push("자외선이 매우 강해요. 선크림, 선글라스, 모자");
  return o;
}

async function loadWx(date){
  const box=document.getElementById("wx"); const info=WX[date]; if(!box||!info) return;
  const key="wx-"+date; let cached=null;
  try { cached=JSON.parse(localStorage.getItem(key)||"null"); } catch(e){}
  const normal={src:"normal",mx:info.n[0],mn:info.n[1],rain:null,wind:null,uv:null};
  box.dataset.date = date; paintWx(box, cached||normal, info);
  if (!navigator.onLine) return;
  if (cached && Date.now()-cached.at < 3*3600*1000) return;
  try {
    const url="https://api.open-meteo.com/v1/forecast?latitude="+info.lat+"&longitude="+info.lng+"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,uv_index_max&timezone=auto&start_date="+date+"&end_date="+date;
    const r=await fetch(url); if(!r.ok) return;
    const j=await r.json(); const dd=j.daily; if(!dd||!dd.time||!dd.time.length||dd.temperature_2m_max[0]==null) return;
    const w={src:"forecast",at:Date.now(),code:dd.weather_code[0],mx:dd.temperature_2m_max[0],mn:dd.temperature_2m_min[0],rain:dd.precipitation_probability_max[0],wind:dd.wind_speed_10m_max[0],uv:dd.uv_index_max[0]};
    try { localStorage.setItem(key, JSON.stringify(w)); } catch(e){}
    const b2=document.getElementById("wx"); if (b2 && b2.dataset.date===date) paintWx(b2, w, info);
  } catch(e){}
}

function routeView(){

  const path = "M"+ordered.map(p=>p.join(",")).join(" L");
  let svg = '<svg viewBox="0 0 410 220" role="img" aria-label="뉴질랜드 남섬 캠핑카 경로"><path class="opt" d="M22,198 L45,128"/><text class="n" x="8" y="110">밀포드 (선택)</text><path class="road" d="'+path+'"/>';
  STOPS.forEach(s=>{
    const cur = tIdx>=0 && DAYS[tIdx] && s.day===tIdx;
    const left = s.left || s.x>330;
    const lx = s.down ? s.x : s.up ? s.x+8 : (left ? s.x-9 : s.x+9), ly = s.down ? s.y+18 : s.up ? s.y+15 : s.y+4, anchor = s.down ? "middle" : s.up ? "start" : (left ? "end":"start");
    svg += '<g class="stop'+(s.wild?' wild':'')+(cur?' cur':'')+'" data-goto="'+s.day+'" tabindex="0" role="button" aria-label="'+s.n+' 일정 보기"><circle cx="'+s.x+'" cy="'+s.y+'" r="'+(s.small?4.5:6)+'"/><text x="'+lx+'" y="'+ly+'" text-anchor="'+anchor+'">'+s.n+'</text></g>';
  });
  svg += '</svg>';
  let h = '<section class="block"><h3>남섬 캠핑카 경로</h3><div class="mapcard">'+svg+'</div>';
  h += '<div class="stats"><div><b>1,250km</b><span>밀포드 제외</span></div><div><b>9박</b><span>캠핑카</span></div><div><b>2박</b><span>노지</span></div></div></section>';
  h += '<section class="block"><h3>구간별 이동</h3>';
  DAYS.forEach((d,i)=>{ d.legs.forEach(l=>{ h += '<div class="leg"><div class="km">'+(dObj(d.date).getMonth()+1)+'/'+dObj(d.date).getDate()+'</div><div class="ft">'+esc(l[0])+' → '+esc(l[1])+'</div><div class="km">'+esc(l[2])+'</div><div class="links"><a class="btn" target="_blank" rel="noopener" href="'+DIR(l[3],l[4],l[5])+'">길찾기</a><button class="btn" data-goto="'+i+'">그날 일정</button></div></div>'; }); });
  h += '</section><p class="sub">거리와 시간은 대략적인 값이에요. 실제 경로는 길찾기 버튼으로 확인하세요.</p>';
  return h;
}
function checkRows(list, srcFn){
  return '<ul class="list check">'+list.map(c=>{const on=!!state.checks[c.id];
    return '<li class="'+(on?'done':'')+'" data-check="'+c.id+'" role="checkbox" aria-checked="'+on+'" tabindex="0"><span class="box"></span><div class="body"><div class="nm">'+esc(c.t)+'</div><div class="src">'+esc(srcFn(c))+'</div></div></li>'}).join("")+'</ul>';
}
function checkView(){
  const all = allChecks(), done = all.filter(c=>state.checks[c.id]).length, pct = Math.round(done/all.length*100);
  let h = '<div class="prephead"><div><h2 style="font-family:var(--head);margin:0;font-size:24px">준비</h2></div><div style="text-align:right"><b>'+pct+'%</b><div class="sub">'+done+' / '+all.length+' 완료</div></div></div>';
  h += '<div class="progress"><i style="width:'+pct+'%"></i></div>';
  h += '<div class="seg" role="tablist" aria-label="준비 분류">'+[["pre","출국 전"],["shop","장보기"],["food","가져갈 음식"]].map(s=>'<button role="tab" data-prep="'+s[0]+'" aria-selected="'+(prepTab===s[0])+'">'+s[1]+'</button>').join("")+'</div>';
  if (prepTab==="pre") h += '<section class="block">'+checkRows(CHECK, c=>c.s==="시트"?"엑셀 준비물 시트":"여행 일정 보고 추가")+'</section>';
  if (prepTab==="shop") h += '<section class="block"><p class="prose">15일 퀸즈타운 Pak&#8217;nSave에서 큰 장을 보고, 17일 와나카, 22일 티마루에서 보충해요. 수령할 때 캠핑카에 있는 주방 도구와 양념을 먼저 확인하세요.</p>'+checkRows(SHOPLIST, c=>c.s)+'</section>';
  if (prepTab==="food") h += '<section class="block"><p class="prose">호주(13일)와 뉴질랜드(15일) 두 번 검역을 거쳐요. 아래는 반입 위험이 낮은 것들이지만 <b>모두 신고</b>하세요. 포장과 성분표는 뜯지 말고 한 가방에 모아 두세요.</p>'+checkRows(FOODLIST, c=>c.s)+'<ul class="tips" style="margin-top:10px"><li class="warn"><b>가져가지 마세요:</b> 김치, 육포, 스팸·햄·소시지, 젓갈, 멸치·오징어 등 건어물, 소고기 스프 라면, 즉석국, 생과일·채소, 계란, 꿀, 씨앗</li><li>즉석밥과 라면은 뉴질랜드 큰 마트 아시안 코너에서도 살 수 있어요.</li></ul></section>';
  return h;
}

function render(){
  const main = document.getElementById("main");
  document.getElementById("status").textContent = statusText();
  main.innerHTML = '<div class="view">'+(tab==="today"?todayView():tab==="day"?dayView():tab==="route"?routeView():tab==="check"?checkView():infoView())+'</div>';
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  if (tab==="day"){
    const c = document.querySelector('.chip[data-i="'+sel+'"]');
    if (c) c.scrollIntoView({block:"nearest",inline:"center"});
    const ta = document.getElementById("note");
    let nt=null;
    ta.addEventListener("input", ()=>{ state.notes[DAYS[sel].date]=ta.value; clearTimeout(nt); nt=setTimeout(()=>{persist(); document.getElementById("saved").textContent="저장됨";},500); });
  }
}

  const t = e.target.closest("[data-i],[data-tab],[data-visit],[data-check],[data-goto],[data-prep],[data-themecycle]");
  if (!t) return;
  if (t.dataset.themecycle){ themeMode = themeMode==="auto"?"light":themeMode==="light"?"dark":"auto"; try{localStorage.setItem("theme-mode",themeMode);}catch(err){} applyTheme(); return; }
  if (t.dataset.prep){ prepTab=t.dataset.prep; render(); return; }
  if (t.dataset.tab){ tab=t.dataset.tab; render(); window.scrollTo(0,0); }
  else if (t.dataset.i){ sel=+t.dataset.i; render(); }
  else if (t.dataset.goto){ sel=+t.dataset.goto; tab="day"; render(); window.scrollTo(0,0); }
  else if (t.dataset.visit){ const k=t.dataset.visit; state.visited[k]=!state.visited[k]; if(!state.visited[k]) delete state.visited[k]; persist(); render(); }
  else if (t.dataset.check){ const k=t.dataset.check; state.checks[k]=!state.checks[k]; if(!state.checks[k]) delete state.checks[k]; persist(); render(); }
});
document.addEventListener("keydown", e=>{
  if ((e.key==="Enter"||e.key===" ") && e.target.matches("[data-check],[data-goto]")){ e.preventDefault(); e.target.click(); }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(() => {
      if (!navigator.onLine) setSync("오프라인이에요. 저장해 둔 앱으로 보여드려요.");
    }).catch(() => {});
  });
}
window.addEventListener("offline", () => setSync("오프라인이에요. 체크와 메모는 이 기기에 저장됩니다."));
window.addEventListener("online", () => setSync("체크와 메모는 이 기기에 저장됩니다."));
/* ---------- 예약 서류 (IndexedDB, 이 기기에만) ---------- */
function docDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open("honeymoon-docs",1); r.onupgradeneeded=()=>r.result.createObjectStore("docs",{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function docTx(mode, fn){ const db=await docDB(); return new Promise((res,rej)=>{ const tx=db.transaction("docs",mode); const req=fn(tx.objectStore("docs")); tx.oncomplete=()=>res(req ? req.result : undefined); tx.onerror=()=>rej(tx.error); }); }
async function loadDocs(){
  const box=document.getElementById("docs"); if(!box) return;
  let list=[]; try { list = await docTx("readonly", st=>st.getAll()); } catch(e){ box.innerHTML='<p class="sub">이 브라우저에서는 파일을 저장할 수 없어요.</p>'; return; }
  list.sort((a,b)=>a.added-b.added);
  box.innerHTML = list.length ? '<ul class="list">'+list.map(d=>'<li><div class="body"><div class="nm">'+esc(d.name)+'</div><div class="ds">'+Math.max(1,Math.round(d.size/1024))+'KB</div></div><div class="acts"><button class="mini on" data-docopen="'+d.id+'">열기</button><button class="mini" data-docdel="'+d.id+'">삭제</button></div></li>').join("")+'</ul>' : '<p class="sub">아직 저장된 서류가 없어요. 메일로 받은 PDF를 폰에 내려받은 뒤 파일 추가를 눌러 주세요.</p>';
  const inp=document.getElementById("docfile");
  if (inp) inp.onchange = async () => {
    const files=[...inp.files]; if(!files.length) return;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    for (const f of files){ await docTx("readwrite", st=>st.put({id:Date.now()+"-"+Math.random().toString(36).slice(2,7), name:f.name, type:f.type, size:f.size, blob:f, added:Date.now()})); }
    inp.value=""; await loadDocs();
    const m=document.getElementById("docmsg"); if(m) m.textContent = files.length+"개 저장됨";
  };
}
document.addEventListener("click", async e=>{
  const o=e.target.closest("[data-docopen]"), d=e.target.closest("[data-docdel]");
  if (o){ const rec = await docTx("readonly", st=>st.get(o.dataset.docopen)); if(!rec) return;
    const url=URL.createObjectURL(rec.blob); const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); }
  if (d){ if(!confirm("이 서류를 이 폰에서 지울까요?")) return; await docTx("readwrite", st=>st.delete(d.dataset.docdel)); loadDocs(); }
});
const _render = render;
render = function(){ _render(); applyTheme(); if (tab==="info") loadDocs(); if (tab==="day") loadWx(DAYS[sel].date); if (tab==="today") loadWx(tIdx>=0?DAYS[tIdx].date:DAYS[0].date); };
render();
</script>
</body>

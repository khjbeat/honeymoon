<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13737A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신혼여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>우리의 신혼여행 · 시드니 & 뉴질랜드 남섬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F8F8; --surface:#FFFFFF; --ink:#16313A; --muted:#5A7078; --line:#D5E3E4;
  --lake:#13737A; --lake-soft:#DCEFEF; --gold:#9A6E22; --gold-soft:#F5ECD9;
  --lupin:#6B4F98; --lupin-soft:#ECE6F5; --warn:#9B3B2B; --warn-soft:#F8E6E1;
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C21; --surface:#15282E; --ink:#E4EFEE; --muted:#9AB0B3; --line:#27414A;
    --lake:#5CC6C8; --lake-soft:#173A3E; --gold:#D9AE5E; --gold-soft:#3A3020;
    --lupin:#B49AE0; --lupin-soft:#2C2540; --warn:#F09A86; --warn-soft:#3E211C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C21; --surface:#15282E; --ink:#E4EFEE; --muted:#9AB0B3; --line:#27414A;
  --lake:#5CC6C8; --lake-soft:#173A3E; --gold:#D9AE5E; --gold-soft:#3A3020;
  --lupin:#B49AE0; --lupin-soft:#2C2540; --warn:#F09A86; --warn-soft:#3E211C;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--lake)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 110px}

header.top{padding:22px 0 6px}
.title{font-family:var(--serif);font-size:30px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.status{margin-top:12px;font-size:14px;color:var(--lake);font-weight:500}
.syncnote{font-size:12px;color:var(--muted);margin-top:2px}

/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 10px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px 7px;min-width:62px;text-align:center;cursor:pointer;position:relative}
.chip .d{font-family:var(--serif);font-size:20px;line-height:1;font-weight:700}
.chip .w{font-size:11px;color:var(--muted)}
.chip .p{font-size:11px;margin-top:3px;white-space:nowrap;max-width:68px;overflow:hidden;text-overflow:ellipsis}
.chip.au{border-top:3px solid var(--lupin)}
.chip.nz{border-top:3px solid var(--lake)}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sel .w{color:inherit;opacity:.75}
.chip .today{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--gold);color:#fff;border-radius:8px;padding:0 6px;line-height:16px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle;background:var(--lake)}
.legend span.au::before{background:var(--lupin)}

/* day view */
.dayhead{margin:14px 0 4px}
.dayhead .num{font-size:13px;color:var(--muted)}
.dayhead h2{font-family:var(--serif);font-size:28px;margin:2px 0 0;line-height:1.25}
.dayhead .route{font-size:14px;color:var(--muted);margin-top:4px}
section.block{margin-top:22px}
section.block h3{font-family:var(--serif);font-size:18px;margin:0 0 10px;font-weight:700}
.stay{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stay .kind{font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;display:inline-block}
.kind.hotel{background:var(--lupin-soft);color:var(--lupin)}
.kind.park{background:var(--lake-soft);color:var(--lake)}
.kind.wild{background:var(--gold-soft);color:var(--gold)}
.stay .name{font-family:var(--serif);font-size:19px;font-weight:700;margin:6px 0 2px}
.stay .meta{font-size:13px;color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;text-decoration:none;color:var(--ink);background:var(--bg);cursor:pointer}
.btn.primary{background:var(--lake);border-color:var(--lake);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1C21}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1C21}}

.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 12px 18px}
.timeline li::before{content:"";position:absolute;left:-6px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--lake)}
.timeline .t{font-weight:700;font-size:14px;margin-right:8px;font-variant-numeric:tabular-nums}
.leg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:8px}
.leg .ft{font-weight:500}
.leg .km{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.list li:first-child{border-top:0}
.list .body{flex:1;min-width:0}
.list .nm{font-weight:700}
.list .ds{font-size:13px;color:var(--muted)}
.list .tag{font-size:11px;color:var(--gold);font-weight:500;margin-left:6px}
.list .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mini{font-size:12px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--bg);white-space:nowrap;cursor:pointer}
.mini.on{background:var(--lake);border-color:var(--lake);color:#fff}
.tips{list-style:none;padding:0;margin:0}
.tips li{padding:10px 14px;border-radius:12px;background:var(--lake-soft);margin-bottom:8px;font-size:14px}
.tips li.warn{background:var(--warn-soft);color:var(--ink)}
.tips li.warn b{color:var(--warn)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
.saved{font-size:12px;color:var(--muted);height:16px;margin-top:4px}

/* route map */
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 8px 4px;overflow-x:auto}
.mapcard svg{display:block;width:100%;height:auto}
.mapcard .road{fill:none;stroke:var(--lake);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mapcard .opt{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:4 5}
.mapcard .stop circle{fill:var(--surface);stroke:var(--lake);stroke-width:2.5;cursor:pointer}
.mapcard .stop.wild circle{stroke:var(--gold)}
.mapcard .stop.cur circle{fill:var(--gold);stroke:var(--gold)}
.mapcard text{font-family:var(--sans);font-size:12.5px;fill:var(--ink)}
.mapcard text.n{font-size:11px;fill:var(--muted)}
.total{display:flex;gap:18px;margin:12px 2px 0;font-size:14px}
.total b{font-family:var(--serif);font-size:22px;display:block}

/* checklist */
.check li{align-items:center;cursor:pointer}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center}
.done .box{background:var(--lake);border-color:var(--lake)}
.done .box::after{content:"";width:10px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .nm{text-decoration:line-through;color:var(--muted)}
.src{font-size:11px;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--lake)}

table.info{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table.info td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
table.info tr:first-child td{border-top:0}
table.info td:first-child{color:var(--muted);width:38%}
p.prose{margin:0 0 10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;font-size:13px;color:var(--muted);cursor:pointer}
nav.tabs button svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--lake);font-weight:700}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
</head>

/* ---------- state (browser + shared db) ---------- */
let state = {checks:{}, visited:{}, notes:{}};
try { const s = localStorage.getItem("honeymoon-state"); if (s) state = Object.assign(state, JSON.parse(s)); } catch(e){}
let dbRef = null, writing = false, pending = false, saveTimer = null;
function persist(){
  try { localStorage.setItem("honeymoon-state", JSON.stringify(state)); } catch(e){}
  if (!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!dbRef) return;
  if (writing){ pending = true; return; }
  writing = true;
  try { await dbRef.set(JSON.parse(JSON.stringify(state))); setSync("두 기기에서 같은 내용이 보이도록 저장됩니다."); }
  catch(e){ setSync("이 기기에만 저장 중입니다. 연결되면 다시 동기화됩니다."); }
  writing = false;
  if (pending){ pending = false; flush(); }
}
function setSync(t){ document.getElementById("syncnote").textContent = t; }
(async () => {
  try {
    if (!window.claude || !window.claude.use) { setSync("체크와 메모는 이 기기에 저장됩니다."); return; }
    const db = await window.claude.use("db");
    if (!db) { setSync("체크와 메모는 이 기기에 저장됩니다."); return; }
    dbRef = db.doc("trip/state");
    const timer = setTimeout(() => setSync("저장소에 아직 연결되지 않았어요. 이 기기 내용으로 보여드려요."), 10000);
    dbRef.onSnapshot(snap => {
      if (!snap.fromCache) clearTimeout(timer);
      if (snap.exists && !snap.hasPendingWrites){
        const d = snap.data() || {};
        state = {checks:d.checks||{}, visited:d.visited||{}, notes:d.notes||{}};
        try { localStorage.setItem("honeymoon-state", JSON.stringify(state)); } catch(e){}
        if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") render();
      } else if (!snap.exists && !snap.fromCache){
        flush();
      }
      if (!snap.fromCache) setSync("체크와 메모가 저장되어 다른 기기에서도 보여요.");
    }, () => { clearTimeout(timer); setSync("체크와 메모는 이 기기에 저장됩니다."); dbRef = null; });
  } catch(e){ setSync("체크와 메모는 이 기기에 저장됩니다."); }
})();

/* ---------- helpers ---------- */
const WD = ["일","월","화","수","목","금","토"];
function pad(n){return String(n).padStart(2,"0")}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function dObj(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const today = todayStr();
let tIdx = DAYS.findIndex(d => d.date === today);
let sel = tIdx >= 0 ? tIdx : (today < DAYS[0].date ? 0 : DAYS.length-1);
let tab = "day";

function statusText(){
  if (tIdx >= 0) return "오늘은 여행 " + (tIdx+1) + "일째, " + DAYS[tIdx].place + "에 있어요.";
  const diff = Math.round((dObj(DAYS[0].date) - dObj(today))/86400000);
  if (diff > 0) return "출발까지 " + diff + "일 남았어요.";
  return "여행을 마쳤어요. 사진 정리할 차례!";
}

/* ---------- views ---------- */
function stripHTML(){
  return '<div class="legend"><span class="au">호주</span><span>뉴질랜드 (캠핑카)</span></div><div class="strip" id="strip" role="tablist" aria-label="날짜 선택">' +
    DAYS.map((d,i)=>{const o=dObj(d.date);
      return '<button class="chip '+d.c+(i===sel?' sel':'')+'" data-i="'+i+'" aria-selected="'+(i===sel)+'">'+
      (i===tIdx?'<span class="today">오늘</span>':'')+
      '<div class="d">'+o.getDate()+'</div><div class="w">'+WD[o.getDay()]+'</div><div class="p">'+esc(d.place)+'</div></button>'}).join("") + '</div>';
}
function placeRow(kind, i, item, dayIdx){
  const [nm, ds, q] = item; const key = dayIdx+"-"+kind+"-"+i;
  const on = !!state.visited[key];
  return '<li><div class="body"><div class="nm">'+esc(nm)+'</div><div class="ds">'+esc(ds)+'</div></div><div class="acts">'+
    (q?'<a class="mini" target="_blank" rel="noopener" href="'+G(q)+'">지도</a>':'')+
    '<button class="mini'+(on?' on':'')+'" data-visit="'+key+'" aria-pressed="'+on+'">'+(on?'다녀옴':'가볼래')+'</button></div></li>';
}
function dayView(){
  const d = DAYS[sel], o = dObj(d.date);
  let h = stripHTML();
  h += '<div class="dayhead"><div class="num">'+(sel+1)+'일째 · '+(o.getMonth()+1)+'월 '+o.getDate()+'일 ('+WD[o.getDay()]+')'+(d.camper?' · 캠핑카':'')+'</div><h2>'+esc(d.title)+'</h2></div>';
  if (d.stay){
    const k = d.stay.kind, label = k==="hotel"?"호텔":k==="park"?"홀리데이 파크":"노지";
    h += '<section class="block"><h3>오늘 밤 잘 곳</h3><div class="stay"><span class="kind '+k+'">'+label+'</span><div class="name">'+esc(d.stay.name)+'</div><div class="meta">'+esc(d.stay.meta)+'</div><div class="links"><a class="btn primary" target="_blank" rel="noopener" href="'+G(d.stay.q)+'">지도에서 보기</a></div></div></section>';
  }
  if (d.times.length) h += '<section class="block"><h3>시간표</h3><ul class="timeline">'+d.times.map(t=>'<li><span class="t">'+esc(t[0])+'</span>'+esc(t[1])+'</li>').join("")+'</ul></section>';
  if (d.legs.length) h += '<section class="block"><h3>이동</h3>'+d.legs.map(l=>'<div class="leg"><div class="ft">'+esc(l[0])+' → '+esc(l[1])+'</div><div class="km">'+esc(l[2])+'</div><div class="links"><a class="btn" target="_blank" rel="noopener" href="'+DIR(l[3],l[4],l[5])+'">길찾기</a></div></div>').join("")+'</section>';
  if (d.eat.length) h += '<section class="block"><h3>먹을 곳</h3><ul class="list">'+d.eat.map((e,i)=>placeRow("e",i,e,sel)).join("")+'</ul></section>';
  if (d.todo.length) h += '<section class="block"><h3>할 것 · 볼 것</h3><ul class="list">'+d.todo.map((e,i)=>placeRow("t",i,e,sel)).join("")+'</ul></section>';
  if (d.tips.length) h += '<section class="block"><h3>알아둘 것</h3><ul class="tips">'+d.tips.map(t=>'<li class="'+t[0]+'">'+t[1]+'</li>').join("")+'</ul></section>';
  h += '<section class="block"><h3>우리의 메모</h3><textarea id="note" placeholder="오늘 있었던 일, 바뀐 계획, 다음에 또 오고 싶은 곳">'+esc(state.notes[d.date]||"")+'</textarea><div class="saved" id="saved"></div></section>';
  return h;
}

function checkView(){
  const done = CHECK.filter(c=>state.checks[c.id]).length;
  let h = '<section class="block"><h3>출발 전 준비</h3><div class="sub">'+done+' / '+CHECK.length+' 완료</div><div class="progress"><i style="width:'+Math.round(done/CHECK.length*100)+'%"></i></div><ul class="list check">';
  CHECK.forEach(c=>{const on=!!state.checks[c.id];
    h += '<li class="'+(on?'done':'')+'" data-check="'+c.id+'" role="checkbox" aria-checked="'+on+'" tabindex="0"><span class="box"></span><div class="body"><div class="nm">'+esc(c.t)+'</div><div class="src">'+(c.s==="시트"?"엑셀 준비물 시트":"여행 일정 보고 추가")+'</div></div></li>'});

}

function render(){
  const main = document.getElementById("main");
  document.getElementById("status").textContent = statusText();
  main.innerHTML = '<div class="view">'+(tab==="day"?dayView():tab==="route"?routeView():tab==="check"?checkView():infoView())+'</div>';
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  if (tab==="day"){
    const c = document.querySelector('.chip[data-i="'+sel+'"]');
    if (c) c.scrollIntoView({block:"nearest",inline:"center"});
    const ta = document.getElementById("note");
    let nt=null;
    ta.addEventListener("input", ()=>{ state.notes[DAYS[sel].date]=ta.value; clearTimeout(nt); nt=setTimeout(()=>{persist(); document.getElementById("saved").textContent="저장됨";},500); });
  }
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-i],[data-tab],[data-visit],[data-check],[data-goto]");
  if (!t) return;
  if (t.dataset.tab){ tab=t.dataset.tab; render(); window.scrollTo(0,0); }
  else if (t.dataset.i){ sel=+t.dataset.i; render(); }
  else if (t.dataset.goto){ sel=+t.dataset.goto; tab="day"; render(); window.scrollTo(0,0); }
  else if (t.dataset.visit){ const k=t.dataset.visit; state.visited[k]=!state.visited[k]; if(!state.visited[k]) delete state.visited[k]; persist(); render(); }
  else if (t.dataset.check){ const k=t.dataset.check; state.checks[k]=!state.checks[k]; if(!state.checks[k]) delete state.checks[k]; persist(); render(); }
});
document.addEventListener("keydown", e=>{
  if ((e.key==="Enter"||e.key===" ") && e.target.matches("[data-check],[data-goto]")){ e.preventDefault(); e.target.click(); }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(() => {
      if (!navigator.onLine) setSync("오프라인이에요. 저장해 둔 앱으로 보여드려요.");
    }).catch(() => {});
  });
}
window.addEventListener("offline", () => setSync("오프라인이에요. 체크와 메모는 이 기기에 저장됩니다."));
window.addEventListener("online", () => setSync("체크와 메모는 이 기기에 저장됩니다."));
/* ---------- 예약 서류 (IndexedDB, 이 기기에만) ---------- */
function docDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open("honeymoon-docs",1); r.onupgradeneeded=()=>r.result.createObjectStore("docs",{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function docTx(mode, fn){ const db=await docDB(); return new Promise((res,rej)=>{ const tx=db.transaction("docs",mode); const req=fn(tx.objectStore("docs")); tx.oncomplete=()=>res(req ? req.result : undefined); tx.onerror=()=>rej(tx.error); }); }
async function loadDocs(){
  const box=document.getElementById("docs"); if(!box) return;
  let list=[]; try { list = await docTx("readonly", st=>st.getAll()); } catch(e){ box.innerHTML='<p class="sub">이 브라우저에서는 파일을 저장할 수 없어요.</p>'; return; }
  list.sort((a,b)=>a.added-b.added);
  box.innerHTML = list.length ? '<ul class="list">'+list.map(d=>'<li><div class="body"><div class="nm">'+esc(d.name)+'</div><div class="ds">'+Math.max(1,Math.round(d.size/1024))+'KB</div></div><div class="acts"><button class="mini on" data-docopen="'+d.id+'">열기</button><button class="mini" data-docdel="'+d.id+'">삭제</button></div></li>').join("")+'</ul>' : '<p class="sub">아직 저장된 서류가 없어요. 메일로 받은 PDF를 폰에 내려받은 뒤 파일 추가를 눌러 주세요.</p>';
  const inp=document.getElementById("docfile");
  if (inp) inp.onchange = async () => {
    const files=[...inp.files]; if(!files.length) return;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    for (const f of files){ await docTx("readwrite", st=>st.put({id:Date.now()+"-"+Math.random().toString(36).slice(2,7), name:f.name, type:f.type, size:f.size, blob:f, added:Date.now()})); }
    inp.value=""; await loadDocs();
    const m=document.getElementById("docmsg"); if(m) m.textContent = files.length+"개 저장됨";
  };
}
document.addEventListener("click", async e=>{
  const o=e.target.closest("[data-docopen]"), d=e.target.closest("[data-docdel]");
  if (o){ const rec = await docTx("readonly", st=>st.get(o.dataset.docopen)); if(!rec) return;
    const url=URL.createObjectURL(rec.blob); const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); }
  if (d){ if(!confirm("이 서류를 이 폰에서 지울까요?")) return; await docTx("readwrite", st=>st.delete(d.dataset.docdel)); loadDocs(); }
});
const _render = render;
render = function(){ _render(); if (tab==="info") loadDocs(); };
render();
</script>
